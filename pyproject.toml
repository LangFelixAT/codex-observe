[project]
name = "codex-observe"
version = "0.1.0"
description = "Offline observability dashboard for OpenAI Codex JSONL session logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35",
  "pandas>=2.0",
]

[project.scripts]
codex-observe = "codex_observe.cli:main"

[tool.setuptools.packages.find]
include = ["codex_observe*"]
